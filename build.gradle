import java.util.jar.JarFile
import java.util.zip.ZipInputStream
import java.security.MessageDigest
import java.util.HexFormat
import org.gradle.api.tasks.bundling.AbstractArchiveTask
import io.luna.build.PrepareReleaseCache

plugins {
    id 'application'
}

group = 'io.luna'
version = '377'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = 'ClientLauncher'
    applicationName = 'luna-dev'
}

def clientProperties = ['client.properties']

def preparedCache = tasks.register('prepareReleaseCache', PrepareReleaseCache) {
    group = 'build setup'
    description = 'Validates an explicitly supplied local cache ZIP for shared browser and desktop builds.'
    localCacheZip.set(layout.file(providers.gradleProperty('cacheZip').map { file(it) }))
    outputDirectory.set(layout.projectDirectory.dir('data/bootstrap'))
}

distributions {
    main {
        contents {
            from(layout.projectDirectory) {
                include clientProperties
            }
        }
    }
}

sourceSets {
    main {
        java.srcDirs = ['src']
        resources.srcDirs = []
    }
    test {
        java.srcDirs = ['test']
        resources.srcDirs = []
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.named('processResources') {
    duplicatesStrategy = DuplicatesStrategy.FAIL
    from('data') {
        include 'soundbank.sf2', 'title/**'
        into 'data'
    }
    from(preparedCache.flatMap { it.outputDirectory }) {
        include 'cache.zip', 'cache.sha256'
        into 'bootstrap'
    }
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.register('validateClientProperties') {
    doLast {
        clientProperties.each { filename ->
            if (!file(filename).isFile()) {
                throw new GradleException("Missing root client settings file: ${filename}")
            }
        }
    }
}

tasks.named('jar') {
    dependsOn tasks.named('validateClientProperties')
    archiveFileName = 'luna-dev.jar'
    duplicatesStrategy = DuplicatesStrategy.FAIL
    from('client.properties')
    manifest {
        attributes('Main-Class': application.mainClass.get(),
                'Implementation-Title': 'Luna',
                'Implementation-Version': project.version)
    }
}

tasks.register('browserSite') {
    group = 'build'
    description = 'Builds the browser client from the same current Java sources and cache as the desktop client.'
    dependsOn ':browser:browserSite'
}

tasks.register('allClientBuilds') {
    group = 'build'
    description = 'Builds the development desktop and browser clients using the explicit cache ZIP.'
    dependsOn tasks.named('jar'), tasks.named('browserSite')
}

// These regression fixtures are plain Java entry points rather than JUnit tests.
tasks.named('test') {
    enabled = false
}

def appletFixtures = ['ClientRenderTimingTest', 'JagAppletTimingTest',
        'ResizableClientInputTest'] as Set
def clientTestTasks = []
fileTree('test').matching { include '**/*Test.java' }.files.sort().each { source ->
    def packageMatch = source.getText('UTF-8') =~ /(?m)^package\s+([\w.]+)\s*;/
    def simpleName = source.name.substring(0, source.name.length() - '.java'.length())
    def className = packageMatch.find() ? packageMatch.group(1) + '.' + simpleName : simpleName
    def taskName = 'run' + className.replace('.', '_')
    clientTestTasks.add(tasks.register(taskName, JavaExec) {
        group = 'verification'
        description = "Runs ${className}."
        dependsOn tasks.named('testClasses')
        classpath = sourceSets.test.runtimeClasspath
        mainClass = className
        javaLauncher = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(21)
        }
        maxHeapSize = '512m'
        jvmArgs '-Djava.awt.headless=' + !appletFixtures.contains(className)
        workingDir = layout.buildDirectory.dir('client-test-work').get().asFile
        doFirst {
            workingDir.mkdirs()
        }
    })
}

tasks.register('clientTest') {
    group = 'verification'
    description = 'Runs all plain Java client regression fixtures.'
    dependsOn clientTestTasks
}

tasks.register('verifyClientJar') {
    group = 'verification'
    description = 'Checks the development executable manifest and packaged runtime assets.'
    dependsOn tasks.named('jar')
    def artifacts = [
            [archive: tasks.named('jar').flatMap { it.archiveFile }, settings: 'client.properties']
    ]
    inputs.files(artifacts.collect { it.archive })
    doLast {
        artifacts.each { artifact ->
            new JarFile(artifact.archive.get().asFile).withCloseable { jar ->
                if (jar.manifest.mainAttributes.getValue('Main-Class') != application.mainClass.get()) {
                    throw new GradleException('The executable JAR must use the shared client launcher.')
                }
                def required = ['client.class', 'ClientLauncher.class', 'luna/ClientConfiguration.class', 'luna/CacheBootstrap.class',
                        'luna/ClientStartup.class', 'client.properties',
                        'data/soundbank.sf2', 'bootstrap/cache.zip', 'bootstrap/cache.sha256']
                ['default', 'christmas', 'easter', 'halloween'].each { season ->
                    ['background.png', 'logo.png'].each { image ->
                        required.add("data/title/${season}/${image}")
                    }
                }
                required.each { path ->
                    if (jar.getJarEntry(path.toString()) == null) {
                        throw new GradleException("Missing packaged runtime resource: ${path}")
                    }
                }
                ['luna/CacheBootstrap.class': 'LUNA_MANAGED_CACHE_V1',
                 'luna/ClientStartup.class': 'LUNA_CLIENT_PREPARED'].each { path, marker ->
                    jar.getInputStream(jar.getJarEntry(path)).withCloseable { input ->
                        if (!new String(input.readAllBytes(), java.nio.charset.StandardCharsets.ISO_8859_1).contains(marker)) {
                            throw new GradleException("Missing launcher compatibility protocol: ${marker}")
                        }
                    }
                }
                jar.entries().each { entry ->
                    if (entry.name == 'luna/Constants.class' || entry.name == 'luna/RsaParser.class'
                            || entry.name == 'BetaClientLauncher.class' || entry.name.endsWith('.toml')
                            || entry.name == 'beta.properties') {
                        throw new GradleException("Obsolete client resource must not be packaged: ${entry.name}")
                    }
                    if (entry.name.startsWith('cache/') || entry.name.startsWith('luna/cache/')) {
                        throw new GradleException('The mutable game cache must remain outside the executable JAR.')
                    }
                }
                jar.getInputStream(jar.getJarEntry('client.properties')).withCloseable { input ->
                    if (!java.util.Arrays.equals(input.readAllBytes(), file(artifact.settings).bytes)) {
                        throw new GradleException('The executable must bundle its own root settings file without changes.')
                    }
                }
                def expectedStores = (['main_file_cache.dat'] + (0..4).collect { "main_file_cache.idx${it}".toString() }) as Set
                def expectedHashes = [:]
                jar.getInputStream(jar.getJarEntry('bootstrap/cache.sha256')).withCloseable { input ->
                    input.getText('UTF-8').readLines().each { line ->
                        def match = line =~ /^([0-9a-f]{64})  (main_file_cache\.(?:dat|idx[0-4]))$/
                        if (!match.matches() || expectedHashes.put(match[0][2], match[0][1]) != null) {
                            throw new GradleException('The bundled cache manifest must contain six unique SHA-256 entries.')
                        }
                    }
                }
                if (expectedHashes.keySet() != expectedStores) {
                    throw new GradleException('The bundled cache manifest must describe every core store exactly once.')
                }
                def bundledStores = [] as Set
                new ZipInputStream(jar.getInputStream(jar.getJarEntry('bootstrap/cache.zip'))).withCloseable { zip ->
                    def entry
                    long totalBytes = 0
                    byte[] buffer = new byte[8192]
                    while ((entry = zip.nextEntry) != null) {
                        if (entry.directory || !expectedStores.contains(entry.name) || !bundledStores.add(entry.name)) {
                            throw new GradleException("Unexpected or duplicate bundled cache entry: ${entry.name}")
                        }
                        def digest = MessageDigest.getInstance('SHA-256')
                        long storeBytes = 0
                        int count
                        while ((count = zip.read(buffer)) != -1) {
                            digest.update(buffer, 0, count)
                            storeBytes += count
                            totalBytes += count
                            if (totalBytes > 512L * 1024 * 1024) {
                                throw new GradleException('The bundled cache exceeds its expected extraction limit.')
                            }
                        }
                        if (storeBytes == 0 || HexFormat.of().formatHex(digest.digest()) != expectedHashes[entry.name]) {
                            throw new GradleException("Bundled cache checksum mismatch: ${entry.name}")
                        }
                    }
                }
                if (bundledStores != expectedStores) {
                    throw new GradleException('The bundled cache ZIP must contain every core store exactly once.')
                }
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('clientTest'), tasks.named('verifyClientJar')
}
