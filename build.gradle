import java.util.jar.JarFile
import java.util.zip.ZipInputStream
import java.security.MessageDigest
import java.util.HexFormat
import org.gradle.api.tasks.bundling.AbstractArchiveTask

plugins {
    id 'application'
}

group = 'io.luna'
version = '377'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = 'ClientLauncher'
    applicationName = 'Luna-Development'
}

sourceSets {
    main {
        java.srcDirs = ['src']
        resources.srcDirs = []
    }
    test {
        java.srcDirs = ['test']
        resources.srcDirs = []
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.named('processResources') {
    duplicatesStrategy = DuplicatesStrategy.FAIL
    from('data') {
        include 'soundbank.sf2', 'title/**'
        into 'data'
    }
    from('rsa') {
        include 'rsapub.toml'
        into 'rsa'
    }
    from('data/bootstrap') {
        include 'cache.zip', 'cache.sha256'
        into 'bootstrap'
    }
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.named('jar') {
    archiveFileName = 'Luna-Development.jar'
    manifest {
        attributes('Main-Class': application.mainClass.get(),
                'Implementation-Title': 'luna-rs #377',
                'Implementation-Version': project.version)
    }
}

tasks.register('betaJar', Jar) {
    group = 'build'
    description = 'Builds the beta executable with its beta profile selected automatically.'
    dependsOn tasks.named('classes')
    from sourceSets.main.output
    destinationDirectory = layout.buildDirectory.dir('libs')
    archiveFileName = 'Luna-Beta.jar'
    duplicatesStrategy = DuplicatesStrategy.FAIL
    manifest {
        attributes('Main-Class': 'BetaClientLauncher',
                'Implementation-Title': 'luna-rs #377 (beta)',
                'Implementation-Version': project.version)
    }
}

tasks.named('assemble') {
    dependsOn tasks.named('betaJar')
}

// These regression fixtures are plain Java entry points rather than JUnit tests.
tasks.named('test') {
    enabled = false
}

def appletFixtures = ['BetaConfigurationTest', 'ClientRenderTimingTest', 'JagAppletTimingTest',
        'ResizableClientInputTest'] as Set
def clientTestTasks = []
fileTree('test').matching { include '**/*Test.java' }.files.sort().each { source ->
    def packageMatch = source.getText('UTF-8') =~ /(?m)^package\s+([\w.]+)\s*;/
    def simpleName = source.name.substring(0, source.name.length() - '.java'.length())
    def className = packageMatch.find() ? packageMatch.group(1) + '.' + simpleName : simpleName
    def taskName = 'run' + className.replace('.', '_')
    clientTestTasks.add(tasks.register(taskName, JavaExec) {
        group = 'verification'
        description = "Runs ${className}."
        dependsOn tasks.named('testClasses')
        classpath = sourceSets.test.runtimeClasspath
        mainClass = className
        javaLauncher = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(21)
        }
        maxHeapSize = '512m'
        jvmArgs '-Djava.awt.headless=' + !appletFixtures.contains(className)
        workingDir = layout.buildDirectory.dir('client-test-work').get().asFile
        doFirst {
            workingDir.mkdirs()
        }
    })
}

tasks.register('clientTest') {
    group = 'verification'
    description = 'Runs all plain Java client regression fixtures.'
    dependsOn clientTestTasks
}

tasks.register('verifyLocalServerToggle', JavaExec) {
    group = 'verification'
    description = 'Checks that the localhost switch preserves cache and endpoint configuration.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'BetaConfigurationTest'
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
    maxHeapSize = '512m'
    jvmArgs '-Djava.awt.headless=false', '-Dluna.local=true'
    workingDir = layout.buildDirectory.dir('client-test-work').get().asFile
    doFirst {
        workingDir.mkdirs()
    }
}

['verifyBetaServerToggle': ['-Dluna.beta=true'],
 'verifyLocalBetaServerToggle': ['-Dluna.beta=true', '-Dluna.local=true']].each { taskName, options ->
    tasks.register(taskName, JavaExec) {
        group = 'verification'
        description = 'Checks beta profile selection and the optional localhost override.'
        dependsOn tasks.named('testClasses')
        classpath = sourceSets.test.runtimeClasspath
        mainClass = 'BetaConfigurationTest'
        javaLauncher = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(21)
        }
        maxHeapSize = '512m'
        jvmArgs(['-Djava.awt.headless=false'] + options)
        workingDir = layout.buildDirectory.dir('client-test-work').get().asFile
        doFirst {
            workingDir.mkdirs()
        }
    }
}

tasks.register('verifyBetaJar') {
    group = 'verification'
    description = 'Checks both executable manifests and their packaged runtime assets.'
    dependsOn tasks.named('jar'), tasks.named('betaJar')
    def artifacts = [
            [archive: tasks.named('jar').flatMap { it.archiveFile }, main: 'ClientLauncher', title: 'luna-rs #377'],
            [archive: tasks.named('betaJar').flatMap { it.archiveFile }, main: 'BetaClientLauncher', title: 'luna-rs #377 (beta)']
    ]
    inputs.files(artifacts.collect { it.archive })
    doLast {
        artifacts.each { artifact ->
            new JarFile(artifact.archive.get().asFile).withCloseable { jar ->
                if (jar.manifest.mainAttributes.getValue('Main-Class') != artifact.main
                        || jar.manifest.mainAttributes.getValue('Implementation-Title') != artifact.title) {
                    throw new GradleException('The executable JAR must select its intended client profile and title.')
                }
                def required = ['client.class', 'ClientLauncher.class', 'BetaClientLauncher.class', 'luna/Constants.class', 'luna/CacheBootstrap.class', 'rsa/rsapub.toml',
                        'data/soundbank.sf2', 'bootstrap/cache.zip', 'bootstrap/cache.sha256']
                ['christmas', 'easter', 'halloween'].each { season ->
                    ['background.png', 'logo.png'].each { image ->
                        required.add("data/title/${season}/${image}")
                    }
                }
                required.each { path ->
                    if (jar.getJarEntry(path.toString()) == null) {
                        throw new GradleException("Missing packaged runtime resource: ${path}")
                    }
                }
                jar.entries().each { entry ->
                    if (entry.name.startsWith('cache/') || entry.name.startsWith('luna/cache/')) {
                        throw new GradleException('The mutable game cache must remain outside the executable JAR.')
                    }
                }
                def expectedStores = (['main_file_cache.dat'] + (0..4).collect { "main_file_cache.idx${it}".toString() }) as Set
                def expectedHashes = [:]
                jar.getInputStream(jar.getJarEntry('bootstrap/cache.sha256')).withCloseable { input ->
                    input.getText('UTF-8').readLines().each { line ->
                        def match = line =~ /^([0-9a-f]{64})  (main_file_cache\.(?:dat|idx[0-4]))$/
                        if (!match.matches() || expectedHashes.put(match[0][2], match[0][1]) != null) {
                            throw new GradleException('The bundled cache manifest must contain six unique SHA-256 entries.')
                        }
                    }
                }
                if (expectedHashes.keySet() != expectedStores) {
                    throw new GradleException('The bundled cache manifest must describe every core store exactly once.')
                }
                def bundledStores = [] as Set
                new ZipInputStream(jar.getInputStream(jar.getJarEntry('bootstrap/cache.zip'))).withCloseable { zip ->
                    def entry
                    long totalBytes = 0
                    byte[] buffer = new byte[8192]
                    while ((entry = zip.nextEntry) != null) {
                        if (entry.directory || !expectedStores.contains(entry.name) || !bundledStores.add(entry.name)) {
                            throw new GradleException("Unexpected or duplicate bundled cache entry: ${entry.name}")
                        }
                        def digest = MessageDigest.getInstance('SHA-256')
                        long storeBytes = 0
                        int count
                        while ((count = zip.read(buffer)) != -1) {
                            digest.update(buffer, 0, count)
                            storeBytes += count
                            totalBytes += count
                            if (totalBytes > 512L * 1024 * 1024) {
                                throw new GradleException('The bundled cache exceeds its expected extraction limit.')
                            }
                        }
                        if (storeBytes == 0 || HexFormat.of().formatHex(digest.digest()) != expectedHashes[entry.name]) {
                            throw new GradleException("Bundled cache checksum mismatch: ${entry.name}")
                        }
                    }
                }
                if (bundledStores != expectedStores) {
                    throw new GradleException('The bundled cache ZIP must contain every core store exactly once.')
                }
            }
        }
    }
}

tasks.register('verifyClientLaunchers', JavaExec) {
    group = 'verification'
    description = 'Checks that both packaged launchers select software graphics before the client initializes.'
    dependsOn tasks.named('testClasses'), tasks.named('jar'), tasks.named('betaJar')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'ClientLauncherTest'
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
    maxHeapSize = '256m'
    jvmArgs '-Djava.awt.headless=true'
    workingDir = layout.buildDirectory.dir('client-test-work').get().asFile
    doFirst {
        workingDir.mkdirs()
        setArgs([tasks.named('jar').get().archiveFile.get().asFile.absolutePath,
                 tasks.named('betaJar').get().archiveFile.get().asFile.absolutePath])
    }
}

tasks.named('check') {
    dependsOn tasks.named('clientTest'), tasks.named('verifyBetaJar'), tasks.named('verifyClientLaunchers'), tasks.named('verifyLocalServerToggle'),
            tasks.named('verifyBetaServerToggle'), tasks.named('verifyLocalBetaServerToggle')
}
