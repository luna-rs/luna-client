<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Luna · TeaVM browser client</title>
    <style>
        body { margin: 0; padding: 16px; background: #171714; color: #e9e4d7; font: 15px system-ui, sans-serif; }
        main { margin: auto; }
        h1 { font-size: 24px; font-weight: 600; }
        button, select { padding: 10px 18px; border: 1px solid #a28b54; border-radius: 6px;
            background: #4b4129; color: inherit; font: inherit; }
        button { cursor: pointer; }
        :disabled { opacity: .6; cursor: default; }
        #status { margin-left: 14px; }
        /* Startup fallback; platform.js sets both CSS sizes to framebuffer size / devicePixelRatio. */
        #game-container { width: 765px; height: 503px; margin: 16px auto; background: #000; }
        canvas { display: block; width: 765px; height: 503px; background: #000; outline: none;
            image-rendering: pixelated; }
        #viewport-size { margin-left: 12px; color: #c9bd9f; }
        pre { white-space: pre-wrap; overflow-wrap: anywhere; font: 12px ui-monospace, monospace; }
    </style>
</head>
<body>
<main>
    <h1 id="title">luna-rs #377 · TeaVM</h1>
    <select id="server" aria-label="Server"><option value="development">Development</option>
        <option value="beta">Beta</option></select>
    <button id="start" disabled>Start client</button><span id="status" role="status">Loading client code…</span>
    <span id="viewport-size">Fixed · 765 × 503 · native pixels</span>
    <span id="runtime-stats" aria-label="Client performance"></span>
    <div id="game-container">
        <canvas id="game" width="765" height="503" tabindex="0" aria-label="Luna game client"></canvas>
    </div>
    <details><summary>Startup log</summary><pre id="log"></pre></details>
</main>
<script>
    const log = document.getElementById('log');
    const messages = [];
    const status = document.getElementById('status');
    function logMessage(message) {
        messages.push(message);
        if (messages.length > 250) messages.shift();
        log.textContent = messages.join('\n') + '\n';
    }
    for (const name of ['log', 'info', 'warn', 'error']) {
        const original = console[name].bind(console);
        console[name] = (...args) => {
            original(...args);
            logMessage(args.map(String).join(' '));
        };
    }
    window.addEventListener('error', event => {
        logMessage(event.error?.stack || event.message);
        status.textContent = 'Client error; see startup log';
    });
    window.addEventListener('unhandledrejection', event => {
        logMessage(event.reason?.stack || String(event.reason));
        status.textContent = 'Client error; see startup log';
    });
    window.LUNA_WEBSOCKET_URL = window.LUNA_WEBSOCKET_URL || location.origin.replace(/^http/, 'ws') + '/game';
    document.getElementById('start').addEventListener('click', () => {
        window.LunaBrowser.unlockAudio();
        document.getElementById('start').disabled = true;
        document.getElementById('server').disabled = true;
        status.textContent = 'Starting client…';
        document.getElementById('game').focus();
        try { main([]); } catch (error) {
            logMessage(error.stack || String(error));
            status.textContent = 'Client could not start';
        }
    });
    async function codeLoaded() {
        try {
            if (!window.LUNA_CLIENT_CONFIG) {
                const response = await fetch('client-config.json', {cache: 'no-store'});
                if (!response.ok) {
                    throw new Error('Client endpoint configuration could not load (HTTP ' + response.status + ')');
                }
                window.LUNA_CLIENT_CONFIG = await response.json();
            }
            for (const profile of ['development', 'beta']) {
                const endpoint = window.LUNA_CLIENT_CONFIG[profile];
                if (!endpoint || typeof endpoint.host !== 'string' || !Number.isInteger(endpoint.port)
                    || endpoint.port < 1 || endpoint.port > 65535) {
                    throw new Error('Invalid ' + profile + ' endpoint');
                }
            }
            document.getElementById('start').disabled = false;
            status.textContent = 'Ready';
        } catch (error) {
            status.textContent = 'Client configuration could not load';
            logMessage(error.stack || String(error));
        }
    }
</script>
<script src="cache.js"></script>
<script src="platform.js"></script>
<script src="performance.js"></script>
<script>
    if (new URLSearchParams(location.search).has('profile')) {
        const profiling = document.createElement('script');
        profiling.src = 'profiling.js';
        document.head.append(profiling);
    }
</script>
<script src="client-loader.js"></script>
</body>
</html>
