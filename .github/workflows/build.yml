name: Compile development clients

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webclient-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'luna-rs/luna-client' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout webclient source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare the Gradle distribution
        run: |
          archive="$RUNNER_TEMP/gradle-8.14.1-bin.zip"
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors --retry-delay 2 \
            --connect-timeout 20 --max-time 180 --proto '=https' --proto-redir '=https' \
            --header 'Accept: application/octet-stream' \
            'https://api.github.com/repos/gradle/gradle-distributions/releases/assets/257092267' \
            --output "$archive"
          printf '%s  %s\n' '845952a9d6afa783db70bb3b0effaae45ae5542ca2bb7929619e8af49cb634cf' "$archive" | sha256sum --check
          unzip -q "$archive" -d "$RUNNER_TEMP/luna-gradle"
          echo "$RUNNER_TEMP/luna-gradle/gradle-8.14.1/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/luna-gradle/gradle-8.14.1/bin/gradle" --version

      - name: Compile shared desktop and browser source without a game cache
        run: gradle --no-daemon --max-workers=2 compileJava :browser:compileJava
