name: Sync upstream client
run-name: Sync upstream client by @${{ github.actor }}

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-upstream-client
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      status: ${{ steps.sync.outputs.status }}
      branch: ${{ steps.sync.outputs.branch }}
      candidate_sha: ${{ steps.sync.outputs.candidate_sha }}
      pull_request_url: ${{ steps.sync.outputs.pull_request_url }}
    steps:
      - name: Checkout the maintained webclient
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Prepare an upstream pull request
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/sync-upstream.mjs

  validate-candidate:
    if: needs.sync.outputs.status == 'merged'
    needs: sync
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout the exact merged candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.sync.outputs.candidate_sha }}
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Build both browser targets
        run: bash ./gradlew --no-daemon --max-workers=2 :browser:browserSite

      - name: Verify the merged beta static site
        env:
          WEBCLIENT_BUILD_SHA: ${{ needs.sync.outputs.candidate_sha }}
          LUNA_WEBSOCKET_URL: ${{ vars.LUNA_WEBSOCKET_URL }}
        run: GITHUB_SHA="$WEBCLIENT_BUILD_SHA" node browser/build-webclient.mjs

      - name: Upload candidate website for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Upstream-preview
          path: build/webclient-site/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
