name: Build and publish webclient

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webclient-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout webclient source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Prepare the Gradle distribution
        run: |
          archive="$RUNNER_TEMP/gradle-8.14.1-bin.zip"
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors --retry-delay 2 \
            --connect-timeout 20 --max-time 180 --proto '=https' --proto-redir '=https' \
            --header 'Accept: application/octet-stream' \
            'https://api.github.com/repos/gradle/gradle-distributions/releases/assets/257092267' \
            --output "$archive"
          printf '%s  %s\n' '845952a9d6afa783db70bb3b0effaae45ae5542ca2bb7929619e8af49cb634cf' "$archive" | sha256sum --check
          unzip -q "$archive" -d "$RUNNER_TEMP/luna-gradle"
          echo "$RUNNER_TEMP/luna-gradle/gradle-8.14.1/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/luna-gradle/gradle-8.14.1/bin/gradle" --version

      - name: Build the shared Java browser client
        env:
          CLIENT_PROPERTIES: ${{ vars.CLIENT_PROPERTIES || 'client.properties' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: gradle --no-daemon --max-workers=2 :browser:browserSite -PclientProperties="$CLIENT_PROPERTIES"

      - name: Prepare the selected client website
        run: node browser/build-webclient.mjs

      - name: Include the separately released mobile web app
        if: github.ref == 'refs/heads/master' && vars.PUBLISH_GITHUB_PAGES == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 browser/include-mobile.py build/webclient-site
          if [ -d build/webclient-site/mobile ]; then
            node browser/configuration.mjs --pages build/webclient-site/mobile
          fi

      - name: Upload downloadable static website
        id: website
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Luna-Webclient
          path: build/webclient-site/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Validate the selected properties for GitHub Pages
        if: github.ref == 'refs/heads/master' && vars.PUBLISH_GITHUB_PAGES == 'true'
        run: node browser/configuration.mjs --pages build/webclient-site

      - name: Upload optional GitHub Pages artifact
        if: github.ref == 'refs/heads/master' && vars.PUBLISH_GITHUB_PAGES == 'true'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: build/webclient-site

      - name: Explain the build output
        env:
          ARTIFACT_URL: ${{ steps.website.outputs.artifact-url }}
          PAGES_REQUESTED: ${{ github.ref == 'refs/heads/master' && vars.PUBLISH_GITHUB_PAGES == 'true' }}
        run: |
          node --input-type=module <<'NODE'
          import {appendFile, readFile} from 'node:fs/promises';
          const release = JSON.parse(await readFile('build/webclient-site/release-provenance.json', 'utf8'));
          await appendFile(process.env.GITHUB_STEP_SUMMARY, [
            '## Webclient built',
            '',
            `[Download Luna-Webclient.zip](${process.env.ARTIFACT_URL}) from this run's artifacts.`,
            'Extract its contents into an HTTPS static website directory; index.html is at the archive root.',
            '',
            `Client source: ${release.sourceCommit}`,
            `Webclient build: ${release.browserCommit}`,
            `Cache fingerprint: ${release.cacheFingerprint}`,
            '',
            process.env.PAGES_REQUESTED === 'true'
              ? 'GitHub Pages deployment was requested and runs as a separate job below.'
              : 'GitHub Pages is disabled. The downloadable site is available independently of GitHub Pages eligibility.',
            'Building this website does not deploy or restart the Luna game server.',
            ''
          ].join('\n'));
          NODE

  deploy-pages:
    if: github.ref == 'refs/heads/master' && vars.PUBLISH_GITHUB_PAGES == 'true'
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure optional GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Deploy the static site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
