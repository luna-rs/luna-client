# Luna client configuration. All defaults and saved client preferences live here.
# Each executable bundles its own client.properties. Saved preferences use settingsFile in the client root.
# Values are read from this root folder, independently of the working directory.

settingsFile=beta.properties

# Connection and branding
clientName=luna-rs #377 (beta)
connectHost=85.155.184.204
connectPort=43594
jaggrabPort=43595
httpPort=80
portOffset=0
world=10
members=true
lowMemory=false
debug=true

# Browser game connection and project links. This profile is selected explicitly for beta builds.
# Connects directly to Luna's native WebSocket listener through the VPS Cloudflare tunnel.
websocketUrl=wss://bite-annotation-wales-halifax.trycloudflare.com/game
websiteUrl=https://github.com/luna-rs/luna

# Local web preview and optional WebSocket-to-TCP proxy. Reuses connectHost/connectPort.
# These listener settings do not configure the production Luna server or TLS.
webBindAddress=127.0.0.1
webPort=8090
webOrigin=https://luna-rs.github.io
websocketProxyPort=8810

# Login encryption: PUBLIC values matching the separately generated beta server rsapriv.json.
rsaEnabled=true

rsaExponent=65537

# Game cache stores remain separate from settings. The path must end in luna/cache.
cacheDirectory=${user.home}/luna/cache

# Build-time cache source. "latest" includes prereleases with the named asset.
cacheReleaseRepository=luna-rs/luna-client
cacheReleaseTag=latest
cacheReleaseAsset=cache.zip
cacheStoreId=32

# Window and message preferences, preserved from the current client.
# clientSize: 0 = fixed, 1 = resizable. Width and height are the drawable content size.
clientSize=1
width=2560
height=1369
defaultWidth=1280
defaultHeight=800
coloredGameMessages=true

# Rendering. The original game-update rate and protocol limits are unchanged.
targetFps=60
renderThreads=4
drawDistance=20
showFps=false

# Java2D flags are applied before the AWT client initializes.
graphicsD3d=false
graphicsOpenGl=false
graphicsNoDraw=true

# Initial account-option defaults. Server-supplied account options take precedence after login.
# Brightness: 1..4. Music/sound: 0 = full, 1..3 = reduced, 4 = off.
brightness=2
musicVolume=0
soundVolume=0
mouseButtons=0
chatEffects=0
splitPrivateChat=0
bankInsertMode=0
publicChatMode=0
privateChatMode=0
tradeChatMode=0
